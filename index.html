  <link rel="icon" href="data:,">
  <script>
    // Before first paint (no flash): the 한 / EN choice. The app is light only (DESIGN.md
    // section 4, option A), so no theme is read. English hides the header and screen until
    // js/ui-lang.js has switched them; the timer is a safety net in case a script fails to load.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('topik2.v2') || 'null');
        if (s && s.settings && s.settings.uiLang === 'en') {
          document.documentElement.setAttribute('data-ui-lang', 'en');
          document.documentElement.classList.add('ui-lang-pending');
          setTimeout(function () { document.documentElement.classList.remove('ui-lang-pending'); }, 2000);
        }
      } catch (e) { /* storage blocked: keep Korean */ }
    })();
  </script>

       page with scripts cached from an older release (tests/cache-bust.test.js keeps them in step). -->
