<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TOPIK II 읽기 · 102회</title>
  <link rel="icon" href="data:,">
  <script>
    // Apply a saved light/dark choice before first paint (no flash). Auto = no attribute.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('topik2.v2') || 'null');
        var t = s && s.settings && s.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage blocked: keep auto theme */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles/omr.css">

  <link rel="stylesheet" href="styles/translate.css">
</head>
<body>
  <a class="skip-link" href="#screen">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/today">TOPIK II 읽기 <span class="brand__dot" aria-hidden="true">·</span> <span class="num">102회</span></a>
      <nav class="topnav" aria-label="주 메뉴">
        <a href="#/today" data-nav="today">오늘</a>
        <a href="#/map" data-nav="map">지도</a>
        <a href="#/deck" data-nav="deck">덱</a>
        <a href="#/mock" data-nav="mock">모의고사</a>
      </nav>
      <button type="button" class="theme-toggle gloss-toggle" id="gloss-toggle" aria-pressed="true"
        aria-keyshortcuts="G" title="단어: 올리거나 누르기 · 문장: 오른쪽 클릭이나 길게 누르기">주석 <kbd aria-hidden="true">G</kbd></button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 바꾸기">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
          <path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"></path>
        </svg>
        <span class="theme-toggle__label" data-field="theme">자동</span>
      </button>
    </div>
  </header>

  <p id="storage-note" class="storage-note" role="status" hidden>이 브라우저에서는 공부 기록이 저장되지 않습니다 (저장소 차단).</p>

  <main id="screen" class="page" tabindex="-1"></main>

  <div id="gloss-tooltip" class="gloss-tip" role="tooltip" hidden>
    <span class="gloss-tip__roman" data-tt="roman"></span>
    <span class="gloss-tip__en" data-tt="en" lang="en"></span>
  </div>

  <template id="tpl-load-error">

    </section>
  </template>

  <noscript><p class="page">이 앱은 JavaScript가 필요합니다.</p></noscript>
